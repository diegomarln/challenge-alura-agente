services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - vector_store_data:/app/data/vector_store
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  vector_store_data:
